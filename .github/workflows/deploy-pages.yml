name: Deploy portfolio to site root

# Publishes the Next.js portfolio at https://farhan22025.github.io, and keeps
# the original V1 prototype available at /v1/.
#
# The portfolio's source lives in its own repo (farhan22025/portfolio). This
# workflow checks it out, builds a static export with an empty BASE_PATH so it
# serves from the domain root, and publishes the result here.

on:
  push:
    branches: [main]
  # The portfolio lives in another repo, so a push there cannot trigger this
  # build. After changing it, run this workflow manually:
  #   Actions -> Deploy portfolio to site root -> Run workflow
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the portfolio source
        uses: actions/checkout@v4
        with:
          repository: farhan22025/portfolio
          ref: main
          path: app

      - name: Check out this repo (for the V1 archive)
        uses: actions/checkout@v4
        with:
          path: site

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Type check
        working-directory: app
        run: npm run typecheck

      # Empty BASE_PATH => assets resolve from "/", which is correct for a
      # user site served at the domain root.
      - name: Build static export
        working-directory: app
        env:
          # Content is read from Postgres at build time when this secret exists.
          # Without it the build still succeeds, using the checked-in seed data.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BASE_PATH: ""
        run: npm run build:static

      - name: Archive the V1 prototype at /v1/
        run: |
          OUT="app/out"
          mkdir -p "$OUT/v1"
          for item in index.html script.js styles.css chatbot-data.js assets; do
            if [ -e "site/$item" ]; then cp -r "site/$item" "$OUT/v1/"; fi
          done
          touch "$OUT/.nojekyll"
          echo "Publishing:"
          ls -la "$OUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
